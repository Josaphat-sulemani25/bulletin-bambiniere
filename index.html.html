<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bulletin Scolaire - Ecole la Bambiniere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--vert:#16a34a;--vert-fonce:#14532d;--vert-clair:#dcfce7;--vert-bg:#f0fdf4;--blanc:#ffffff}
body{font-family:Arial,sans-serif;background:#f0f2f7;color:#1a1d23}
.topbar{background:var(--vert-fonce);padding:0 20px;display:flex;align-items:center;justify-content:space-between;height:52px;position:sticky;top:0;z-index:50}
.topbar h1{font-size:15px;font-weight:600;color:#fff}
.tabs{display:flex;gap:2px;background:#e2e5ea;border-radius:10px;padding:4px;margin-bottom:20px;width:fit-content}
.tab{padding:7px 16px;border-radius:7px;border:none;background:none;font-size:13px;font-weight:500;color:#5a6272;cursor:pointer;font-family:inherit}
.tab.active{background:#fff;color:#1a1d23;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.panel{display:none}.panel.active{display:block}
.container{max-width:900px;margin:0 auto;padding:20px 16px}
.card{background:#fff;border-radius:12px;border:1px solid #e2e5ea;padding:16px;margin-bottom:16px}
.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
select,input[type=text]{font-size:14px;padding:7px 11px;border:1px solid #c8cdd6;border-radius:8px;background:#fff;color:#1a1d23;font-family:inherit}
.btn{font-family:inherit;font-size:13px;font-weight:500;padding:7px 14px;border-radius:8px;cursor:pointer;border:1px solid #c8cdd6;background:#fff;color:#1a1d23}
.btn-primary{background:var(--vert);border-color:var(--vert);color:#fff}
.btn-danger{color:#dc2626;border-color:#fca5a5}
.btn-danger:hover{background:#fee2e2}
.btn-green{background:var(--vert);border-color:var(--vert);color:#fff}
.eleve-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.eleve-row{display:flex;align-items:center;gap:8px;background:#f7f8fa;border:1px solid #e2e5ea;border-radius:8px;padding:8px 12px}
.eleve-row span{flex:1;font-size:14px}
.add-row{display:flex;gap:8px}
.add-row input{flex:1}

/* BULLETIN A4 */
.bulletin{background:#fff;width:210mm;min-height:297mm;margin:0 auto;padding:6mm 8mm;border:1px solid #e2e5ea;border-radius:4px}

/* ENTETE */
.school-header{border-bottom:3px solid var(--vert);padding-bottom:4px;margin-bottom:5px;text-align:center}
.school-header img{width:100%;max-width:550px;height:80px;object-fit:contain;display:block;margin:0 auto}
.bulletin-title{font-size:11px;font-weight:700;background:var(--vert);color:#fff;padding:3px 12px;border-radius:4px;display:inline-block;margin:3px 0;text-transform:uppercase;letter-spacing:.5px}

/* INFOS ELEVE */
.eleve-info{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:6px;margin-bottom:5px;background:var(--vert-clair);padding:5px 8px;border-radius:6px;border:1px solid var(--vert)}
.info-label{font-weight:700;color:var(--vert-fonce);font-size:8.5px;text-transform:uppercase}
.info-value{font-size:10.5px;font-weight:600;border-bottom:1px solid var(--vert);padding-bottom:1px}

/* SECTIONS */
.section{margin-bottom:4px}
.section-title{font-size:9.5px;font-weight:700;background:var(--vert-fonce);color:#fff;padding:3px 8px;border-radius:4px;margin-bottom:3px;text-transform:uppercase;letter-spacing:.3px}
.sub-title{font-size:9px;font-weight:700;color:var(--vert-fonce);padding:2px 6px;background:var(--vert-clair);border-radius:3px;margin:2px 0 2px;border-left:3px solid var(--vert)}
.critere-row{display:flex;align-items:center;justify-content:space-between;padding:2.5px 6px;border-bottom:1px solid #f0fdf4;gap:6px}
.critere-label{font-size:9px;flex:1;color:#1a1d23}
.mention-sel{font-size:8.5px;padding:2px 5px;border:1px solid #c8cdd6;border-radius:4px;background:#fff;font-family:inherit;min-width:100px}
.m-ex{background:#dcfce7;color:#16a34a;border-color:#86efac}
.m-tb{background:#dbeafe;color:#2563eb;border-color:#93c5fd}
.m-bi{background:#fef3c7;color:#d97706;border-color:#fcd34d}
.m-ab{background:#fed7aa;color:#c2410c;border-color:#fdba74}
.m-am{background:#fee2e2;color:#dc2626;border-color:#fca5a5}

/* APPRECIATION */
.appreciation-box{margin-top:4px;padding:4px 8px;background:var(--vert-clair);border-radius:6px;border:1px solid var(--vert)}
.appreciation-box label{font-size:8.5px;font-weight:700;color:var(--vert-fonce);text-transform:uppercase;display:block;margin-bottom:3px}
.appreciation-box textarea{width:100%;font-family:inherit;font-size:9px;padding:4px;border:1px solid var(--vert);border-radius:4px;resize:none;background:#fff}

/* SIGNATURE */
.signature-section{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:5px;padding-top:4px;border-top:2px solid var(--vert);text-align:center}
.sig-label{font-size:8.5px;font-weight:700;color:var(--vert-fonce);text-transform:uppercase}
.sig-line{border-bottom:1px solid #1a1d23;margin-top:16px}

.empty{text-align:center;padding:40px;color:#9aa0ae;font-size:14px}
.bottom-bar{display:flex;gap:8px;margin-top:12px}
.toast{position:fixed;bottom:18px;right:18px;padding:11px 16px;border-radius:8px;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none;z-index:999}
.toast.ok{background:#dcfce7;color:#16a34a;border:1px solid #86efac}
.toast.err{background:#fee2e2;color:#dc2626;border:1px solid #fca5a5}

@page{size:A4;margin:6mm}
@media print{
  .topbar,.tabs,.filters,.bottom-bar,.appreciation-box,.no-print{display:none!important}
  body{background:#fff}
  .bulletin{border:none;padding:4mm 6mm;width:100%;min-height:auto;margin:0}
  .container{padding:0;max-width:100%}
  .mention-sel{border:1px solid #ccc;background:transparent!important;font-weight:600;-webkit-appearance:none}
  .print-apprec{display:block!important}
  .section-title{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .eleve-info{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sub-title{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .appreciation-box{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bulletin-title{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .signature-section{border-top:2px solid var(--vert);-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<div class="topbar no-print">
  <h1>📋 Bulletins Scolaires — École la Bambinière</h1>
</div>

<div class="container">
  <div class="tabs no-print">
    <button class="tab active" onclick="showTab('bulletin',this)">📋 Bulletin</button>
    <button class="tab" onclick="showTab('eleves',this)">👦 Gérer les élèves</button>
  </div>

  <!-- BULLETIN -->
  <div class="panel active" id="panel-bulletin">
    <div class="card no-print">
      <div class="filters">
        <select id="sel-classe" onchange="chargerEleves()">
          <option value="">-- Classe --</option>
          <option>Maternelle 1</option>
          <option>Maternelle 2A</option>
          <option>Maternelle 2B</option>
          <option>Grande Section</option>
        </select>
        <select id="sel-eleve"><option value="">-- Élève --</option></select>
        <input type="text" id="inp-annee" value="2025-2026" style="width:130px" />
        <button class="btn btn-primary" onclick="afficherBulletin()">▶ Afficher</button>
      </div>
    </div>
    <div id="bulletin-zone"><div class="empty">👆 Choisissez une classe et un élève</div></div>
  </div>

  <!-- ELEVES -->
  <div class="panel" id="panel-eleves">
    <div class="card">
      <div class="filters">
        <select id="sel-classe-el" onchange="afficherGestion()">
          <option value="">-- Choisir une classe --</option>
          <option>Maternelle 1</option>
          <option>Maternelle 2A</option>
          <option>Maternelle 2B</option>
          <option>Grande Section</option>
        </select>
      </div>
      <div id="gestion-zone"><div class="empty">Choisissez une classe</div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

    {t:'3. Pré-lecture',it:["Lecture des images","Lecture des mots"]},
    {t:'4. Activités artistiques',it:['Dessin','Coloriage','Peinture','Découpage, Picotage, Bricolage','Modelage','Collage']},
    {t:'5. Activités sensorielles',it:["Reconnaître les différentes couleurs","Reconnaître les notions spatiales","Connaître les parties du corps"]}
  ]},
  {s:'III. ACTIVITÉS PHYSIQUES ET MOTRICES',ss:[
    {t:'',it:["Comprendre et respecter les règles","Participer sans contrainte aux jeux"]}
  ]},
  {s:'IV. VIVRE ENSEMBLE',ss:[
    {t:'',it:["Le respect des consignes (merci, bonjour, au revoir)","Accepter de bonnes remarques","Moins d'agressivité","Être en ordre (remise des devoirs)","La ponctualité","Savoir évaluer les dangers, les éviter ou signaler"]}
  ]}
];

let DATA = {};

function showTab(t,btn){
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('panel-'+t).classList.add('active');
  btn.classList.add('active');
  if(t==='eleves') afficherGestion();
}

function getEleves(c){try{const d=JSON.parse(localStorage.getItem('el_'+c));if(d)return d;}catch(e){} return [];}
function saveEleves(c,e){localStorage.setItem('el_'+c,JSON.stringify(e));}

function chargerEleves(){
  const c=document.getElementById('sel-classe').value;
  const sel=document.getElementById('sel-eleve');
  sel.innerHTML='<option value="">-- Élève --</option>';
  getEleves(c).forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;sel.appendChild(o);});
}

function afficherGestion(){
  const c=document.getElementById('sel-classe-el').value;
  const z=document.getElementById('gestion-zone');
  if(!c){z.innerHTML='<div class="empty">Choisissez une classe</div>';return;}
  const eleves=getEleves(c);
  let h='<div class="eleve-list">';
  if(!eleves.length) h+='<div class="empty">Aucun élève — ajoutez en dessous</div>';
  eleves.forEach((e,i)=>{
    h+=`<div class="eleve-row"><span>${i+1}. ${e}</span><button class="btn btn-danger" onclick="supprimerEleve('${c}',${i})">✕ Supprimer</button></div>`;
  });
  h+=`</div><div class="add-row">
    <input type="text" id="inp-el" placeholder="Prénom et Nom de l'élève" onkeydown="if(event.key==='Enter')ajouterEleve('${c}')" />
    <button class="btn btn-primary" onclick="ajouterEleve('${c}')">＋ Ajouter</button>
  </div>`;
  z.innerHTML=h;
}

function ajouterEleve(c){
  const inp=document.getElementById('inp-el');
  const nom=inp.value.trim().toUpperCase();
  if(!nom){showToast('Tapez un nom !','err');return;}
  const el=getEleves(c);
  if(el.includes(nom)){showToast('Élève déjà dans la liste !','err');return;}
  el.push(nom);saveEleves(c,el);inp.value='';
  afficherGestion();showToast('Élève ajouté ✓','ok');
}

function supprimerEleve(c,i){
  if(!confirm('Supprimer cet élève ?'))return;
  const el=getEleves(c);el.splice(i,1);saveEleves(c,el);
  afficherGestion();showToast('Élève supprimé','ok');
}

function getKey(){
  return 'bull_'+document.getElementById('sel-classe').value+'_'+document.getElementById('sel-eleve').value;
}

function afficherBulletin(){
  const classe=document.getElementById('sel-classe').value;
  const eleve=document.getElementById('sel-eleve').value;
  const annee=document.getElementById('inp-annee').value;
  if(!classe||!eleve){showToast('Choisissez une classe et un élève !','err');return;}
  try{const s=localStorage.getItem(getKey());DATA=s?JSON.parse(s):{};}catch(e){DATA={};}

  let h=`<div class="bulletin">
    <div class="school-header">
      <img src="${LOGO}" style="width:100%;max-width:600px;height:85px;object-fit:contain;display:block;margin:0 auto" />
      <div class="bulletin-title">BULLETIN DU 1ER TRIMESTRE — ANNÉE SCOLAIRE ${annee}</div>
    </div>
    <div class="eleve-info">
      <div><div class="info-label">Nom de l'élève</div><div class="info-value">${eleve}</div></div>
      <div><div class="info-label">Classe</div><div class="info-value">${classe}</div></div>
      <div><div class="info-label">Année scolaire</div><div class="info-value">${annee}</div></div>
      <div><div class="info-label">Trimestre</div><div class="info-value">1er Trimestre</div></div>
    </div>`;

  CRITERES.forEach(cat=>{
    h+=`<div class="section"><div class="section-title">${cat.s}</div>`;
    cat.ss.forEach(sub=>{
      if(sub.t) h+=`<div class="sub-title">${sub.t}</div>`;
      sub.it.forEach(item=>{
        const key=cat.s+'|'+sub.t+'|'+item;
        const val=DATA[key]||'';
        const cls=val?(MCLS[val]||''):'';
        h+=`<div class="critere-row">
          <span class="critere-label">• ${item}</span>
          <select class="mention-sel ${cls}" data-key="${key}" onchange="majMention(this)">
            ${MENTIONS.map(m=>`<option value="${m}" ${m===val?'selected':''}>${m||'-- Mention --'}</option>`).join('')}
          </select>
        </div>`;
      });
    });
    h+='</div>';
  });

  const app=DATA['appreciation']||'';
  h+=`
    <div class="appreciation-box no-print">
      <label>Appréciation générale de l'enseignant</label>
      <textarea rows="2" id="txt-apprec" onchange="DATA['appreciation']=this.value">${app}</textarea>
    </div>
    <div class="print-apprec" style="display:none;margin-top:4px;padding:4px 8px;background:#f0fdf4;border-radius:6px;border:1px solid #16a34a">
      <div style="font-size:7px;font-weight:700;color:#14532d;text-transform:uppercase;margin-bottom:3px">Appréciation générale</div>
      <div style="font-size:8px;font-style:italic" id="print-apprec-text">${app}</div>
    </div>
    <div class="signature-section">
      <div><div class="sig-label">Signature de l'enseignant</div><div class="sig-line"></div></div>
      <div><div class="sig-label">Visa de la Direction</div><div class="sig-line"></div></div>
      <div><div class="sig-label">Signature des parents</div><div class="sig-line"></div></div>
    </div>
  </div>
  <div class="bottom-bar no-print">
    <button class="btn btn-primary" onclick="sauvegarder()">💾 Sauvegarder</button>
    <button class="btn btn-green" onclick="imprimer()">🖨️ Imprimer</button>
  </div>`;

  document.getElementById('bulletin-zone').innerHTML=h;
}

function majMention(sel){
  const key=sel.dataset.key;
  const val=sel.value;
  DATA[key]=val;
  sel.className='mention-sel '+(val?(MCLS[val]||''):'');
}

function sauvegarder(){
  const app=document.getElementById('txt-apprec');
  if(app) DATA['appreciation']=app.value;
  localStorage.setItem(getKey(),JSON.stringify(DATA));
  showToast('Bulletin sauvegardé ✓','ok');
}

function imprimer(){
  const app=document.getElementById('txt-apprec');
  if(app){
    DATA['appreciation']=app.value;
    const pa=document.getElementById('print-apprec-text');
    if(pa) pa.textContent=app.value;
    const pb=document.querySelector('.print-apprec');
    if(pb) pb.style.display=app.value?'block':'none';
  }
  localStorage.setItem(getKey(),JSON.stringify(DATA));
  window.print();
}

function showToast(msg,type){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast '+type;t.style.display='block';
  setTimeout(()=>t.style.display='none',2500);
}
</script>
